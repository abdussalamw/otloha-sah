name: Backend quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  otloha-sah:
    name: OtlohaSah
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-secret-key
      ALLOWED_HOSTS: localhost
      DEBUG: 'false'
      REDIS_HOST: localhost
      REDIS_PORT: '6379'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        working-directory: django/OtlohaSah
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
      - name: Validate configuration and migrations
        working-directory: django/OtlohaSah/app
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Test access policy
        working-directory: django/OtlohaSah/app
        run: python manage.py test app.tests.test_security_configuration

  quran-api:
    name: QuranAPI
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-secret-key
      ALLOWED_HOSTS: localhost
      DEBUG: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        working-directory: django/QuranAPI
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
      - name: Validate configuration and migrations
        working-directory: django/QuranAPI
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Test access policy
        working-directory: django/QuranAPI
        run: python manage.py test apps.main.tests.test_access_policy
