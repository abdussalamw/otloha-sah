    path: ../retry_queue_manager
  # form_builder_phone_field: ^2.0.1
  # phone_number: ^2.0.1
  intl_phone_number_input: ^0.7.3+1
  flutter_dotenv: ^6.0.1
  percent_indicator: ^4.2.3
  video_player: ^2.9.1
  youtube_player_iframe: ^6.0.2
  audio_waveforms: ^2.0.2
  sentry_flutter: ^8.7.0
  audio_video_progress_bar: ^2.0.3
  google_sign_in: ^6.2.1
  flutter_html: ^3.0.0-beta.2
  # twitter_login: ^4.4.2
# sqlite3_flutter_libs: ^0.5.4
flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_icon.png"
  background_color: "#397cd6"
  adaptive_icon_background: "assets/icons/dark_background.png"

flutter_native_splash:
  image: assets/icons/Logo-01.png
  image_dark: assets/icons/Logo-01.png
  color: "#397cd6"
  color_dark: "#397cd6"

  android_12:
    image: assets/icons/Logo-01.png
    image_dark: assets/icons/Logo-01.png
    color: "#397cd6"
    color_dark: "#397cd6"

dependency_overrides:
  speech_to_text: 7.3.0
  device_info_plus: 10.1.2


dev_dependencies:
  build_runner: ^2.1.8
  dependency_validator: ^5.0.5
  drift_dev: ^2.5.2
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.0.2
  change_app_package_name: ^1.1.0

  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/fonts/
    - assets/icons/
    - assets/images/
    - assets/quran_assets/
    - assets/svg/
    - assets/lang/
    - assets/1.json
    - assets/2.json
    - assets/7.json
    - assets/terms_conditions.pdf
    - assets/how_it_works.pdf

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo/Cairo-Bold.ttf
        - asset: assets/fonts/Cairo/Cairo-Light.ttf

    - family: HafsSmart
      fonts:
        - asset: assets/fonts/hafs_smart_08.ttf

    - family: QuranKarim
      fonts:
        - asset: assets/fonts/quran_karim.ttf

    - family: Bazzi1
      fonts:
        - asset: assets/fonts/uthmanic_bazzi1_ver07.ttf

    - family: Doori
      fonts:
        - asset: assets/fonts/uthmanic_doori1ver09.ttf

    - family: Hafs17
      fonts:
        - asset: assets/fonts/uthmanic_hafs1_ver17.ttf

    - family: Hafs20
      fonts:
        - asset: assets/fonts/UthmanicHafs_V20.ttf

    - family: Qaloun
      fonts:
        - asset: assets/fonts/UthmanicQaloun_V21.ttf

    - family: Warsh
      fonts:
        - asset: assets/fonts/UthmanicWarsh_V21.ttf

    - family: Beiruti
      fonts:
        - asset: assets/fonts/Beiruti-VariableFont_wght.ttf
