buildscript {
    ext.kotlin_version = '2.1.0'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.0'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    configurations.all {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'org.jetbrains.kotlin' && details.requested.name.startsWith('kotlin-stdlib')) {
                details.useVersion '2.1.0'
            }
        }
    }
}

rootProject.buildDir = '../build'
subprojects { subproject ->
    project.buildDir = "${rootProject.buildDir}/${project.name}"

    if (subproject.state.executed) {
        if (subproject.hasProperty('android')) {
            if (subproject.android.namespace == null) {
                subproject.android.namespace = subproject.group ?: "com.example.${subproject.name}"
            }
            subproject.android.compileSdkVersion 36
        }
    } else {
        subproject.afterEvaluate {
            if (subproject.hasProperty('android')) {
                if (subproject.android.namespace == null) {
                    subproject.android.namespace = subproject.group ?: "com.example.${subproject.name}"
                }
                subproject.android.compileSdkVersion 36
            }
        }
    }
}

subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}

