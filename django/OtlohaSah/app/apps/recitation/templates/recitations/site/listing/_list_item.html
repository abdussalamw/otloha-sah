{% load i18n %}
<div class="card mb-5 mb-xl-10">
  <div class="card-header p-4">
    <div class="card-title align-items-center">
      <div class="symbol symbol-circle symbol-75px me-3">
        <div class="symbol-label" style="background-image: url('{{ item.owner.profile_image }}')">
        </div>
      </div>
      <div class="d-flex flex-column">
        <span class="text-gray-400 fs-7">
          {{ item.owner.get_full_name }}
        </span>
        <a href=""
           class="uthmainc-font text-primary text-hover-primary mb-1">
          {{ item.name }}
        </a>
      </div>
    </div>
    <div class="card-toolbar"></div>
  </div>
  <div class="card-body">
    <div class="symbol me-3">
      <div class="symbol-label">#{{ item.id }}</div>
    </div>
  </div>
</div>
