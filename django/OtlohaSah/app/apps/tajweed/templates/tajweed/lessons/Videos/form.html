{% extends 'base_template/base.html' %}
{% load i18n %}

{% block content %}
<div class="container">
  <div class="row">
    <div class="offset-lg-2 col-lg-8 col-sm-12">
      <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.media }}
        {% include 'django/forms/field.html' with field=form.url %}
        <div class="d-flex justify-content-end mt-4">
          <a class="btn btn-link text-danger mr-2" href="{% url 'admin:tajweed:lessons:listing' %}">{% translate 'Cancel' %}</a>
          <button style="margin-left: 20px" class="btn btn-primary" type="submit">{% translate 'Save' %}</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
