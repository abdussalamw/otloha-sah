{% load quran %}
{% load i18n %}
<div class="flex-column flex-lg-row-auto w-lg-250px w-xl-350px mb-10">
    <div class="card ribbon ribbon-top ribbon-vertical mb-5 mb-xl-8">
        <div class="card-body">
            <div class="d-flex flex-center flex-column py-5">
                <div class="card-title">
                    <h3 class="fw-bold mt-5">{% trans "Level Details" %}</h3>
                </div>
                <div class="fw-bold mt-5">{% trans "Level Id" %}</div>
                <div class="text-gray-600">ID-{{ object.id }}</div>
                <div class="fw-bold mt-5">{% trans "Level Title" %}</div>
                <span class="fs-6 text-gray-600 fw-lighter mb-2">{% blocktrans %}{{ object }}{% endblocktrans %}</span>
                <div class="fw-bold mt-5">{% trans "Level Color" %}</div>
              <div style="width: 30px; height: 30px; background-color: {{ object.color }};"></div>
                <div class="fw-bold mt-5">{% trans "Level Value" %}</div>
                <div class="text-gray-600">Value-{{ object.value }}</div>

            </div>
            <div class="pb-5 fs-6">

            </div>
        </div>
    </div>
</div>
