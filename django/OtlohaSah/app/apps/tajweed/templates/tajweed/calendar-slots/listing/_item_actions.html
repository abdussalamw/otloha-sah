
{% load i18n %}

<div class="dropdown">
  <a href="#" class="btn btn-sm btn-light btn-flex btn-center btn-active-light-primary show menu-dropdown"
     data-kt-menu-trigger="click" data-kt-menu-placement="bottom-end">
    {% trans "Actions" %}
    <i class="ki-duotone ki-down fs-5 ms-1"></i>
  </a>

  <div
      class="menu menu-sub menu-sub-dropdown menu-column menu-rounded menu-gray-600 menu-state-bg-light-primary fw-semibold fs-7 w-125px py-4"
      data-kt-menu="true">
    <div class="menu-item px-3">
      <a href="{% url 'admin:tajweed:calendar-slots:update' pk=item.id %}"
         class="menu-link px-3">
        {% trans "Edit" %}
      </a>
    </div>


    <div class="menu-item px-3">
      <a href="{% url 'admin:tajweed:calendar-slots:delete' pk=item.id %}"
         data-as-form="true"
         data-toggle="confirm"
         data-request-method="POST"
         data-confirm-message="{% trans "Are you sure you would like to do delete this calendar slot!" %}"
         class="menu-link px-3 text-danger">Delete</a>
    </div>

  </div>

</div>
