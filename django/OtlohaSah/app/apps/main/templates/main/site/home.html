{% load static %}
{% load i18n %}

<html lang="en">
<head>
  <title></title>
  <meta charset="utf-8"/>
  <meta name="description" content=""/>
  <meta name="keywords" content=""/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta property="og:locale" content="en_US"/>
  <meta property="og:type" content="description"/>
  <meta property="og:description" content="{% trans "OtlohaSah Home Page" %}"/>
  <meta property="og:title" content="{% trans "OtlohaSah" %}"/>
  <meta property="og:url" content="{{ request.scheme }}://{{ request.get_host }}"/>
  <meta property="og:image" content="{{ request.scheme }}://{{ request.get_host }}{% static "images/logo.png" %}"/>
  <meta property="og:site_name" content="{% trans "OtlohaSah" %}"/>
  <link rel="canonical" href="{{ request.scheme }}://{{ request.get_host }}"/>
  <link rel="shortcut icon" href="{% static "images/favicon.ico" %}"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Inter:300,400,500,600,700"/>

  <link href="{% static "admin/plugins/global/plugins.bundle.css" %}" rel="stylesheet" type="text/css"/>
  <link href="{% static "admin/css/style.bundle.css" %}" rel="stylesheet" type="text/css"/>

</head>
<body id="kt_body" class="app-blank app-blank bgi-size-cover bgi-position-center">
<script>
  var defaultThemeMode = "light",
      themeMode;
  if (document.documentElement) {
    if (document.documentElement.hasAttribute("data-theme-mode")) {
      themeMode = document.documentElement.getAttribute("data-theme-mode");
    } else {
      if (localStorage.getItem("data-theme") !== null) {
        themeMode = localStorage.getItem("data-theme");
      } else {
        themeMode = defaultThemeMode;
      }
    }
    if (themeMode === "system") {
      themeMode = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }
    document.documentElement.setAttribute("data-theme", themeMode);
  }
</script>
<div class="d-flex flex-column flex-root" id="kt_app_root">

  <style>
    body {
      background-image: url('{% static "admin/media/auth/bg4.jpg" %}');
    }

    [data-theme="dark"] body {
      background-image: url('{% static "admin/media/auth/bg4-dark.jpg" %}');
    }
  </style>

  <div class="d-flex flex-column flex-column-fluid flex-lg-row">
    <div class="d-flex flex-center w-lg-50 pt-15 pt-lg-0 px-10">
      <div class="d-flex flex-center flex-column">
        <a href="/" class="mb-7">
          <img alt="Logo" src="{% static "images/logo.png" %}" class="mw-175px"/>
        </a>
        <h2 class="text-white fw-normal m-0">{% trans "Otloha Sah" %}</h2>
      </div>
    </div>
    <div class="d-flex flex-center w-lg-50 p-10">
      {% block content %}{% endblock %}
    </div>
  </div>
</div>

<script>var hostUrl = "admin/";</script>
<script src="{% static "admin/plugins/global/plugins.bundle.js" %}"></script>
<script src="{% static "admin/js/scripts.bundle.js" %}"></script>
{#<script src="{% static "admin/js/custom/authentication/sign-in/general.js" %}"></script>#}
</body>
</html>
