{% load i18n %}
<table class="table table-hover text-nowrap">
  <thead>
  <thead>
  <tr>
    {% for  name, text in columns %}
      <th>
        {{ text }}
      </th>
    {% endfor %}
  </tr>
  </thead>
  <tbody>

  {% if rows|length > 0 %}
    {% for row in rows %}
      <tr>
        {% for cell in row %}
          {{ cell }}
        {% endfor %}
      </tr>
    {% endfor %}
  {% else %}
    <tr class="text-center">
      <td colspan="{{ columns|length }}">{% translate 'There is No records Yet!' %}</td>
    </tr>
  {% endif %}
  </tbody>
</table>
