{% load i18n %}
<div>
  <a href="#" class="btn btn-sm btn-light btn-active-light-primary" data-kt-menu-trigger="click"
     data-kt-menu-placement="bottom">
    {% trans "Actions" %}
    <i class="ki-duotone ki-down fs-5 m-0"></i> </a>
  <div
      class="menu menu-sub menu-sub-dropdown menu-column menu-rounded menu-gray-600 menu-state-bg-light-primary fw-semibold fs-7 w-125px py-4"
      data-kt-menu="true" style="">

    <div class="menu-item px-3">
      <a href="{% url "admin:authorization:edit" object.id %}"
         class="menu-link px-3">
        {% trans "Edit" %}
      </a>
    </div>

    <div class="menu-item px-3">
      <a href="{% url "admin:authorization:delete" group.id %}"
         data-toggle="confirm"
         data-request-method="POST"
         data-as-form="true"
         data-confirm-message="{% trans "Are you sure you want to delete this role?" %}"
         class="menu-link text-danger px-3">
        {% trans "Delete" %}
      </a>
    </div>
  </div>
</div>
