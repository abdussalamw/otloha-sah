{% load i18n %}
{% if request.GET %}
  <a href="#"
     class="btn btn-light btn-active-light-primary ms-3"
     data-kt-menu-trigger="click"
     data-kt-menu-placement="bottom-end">
    {% trans "Actions" %}
  </a>
  <div
      class="menu menu-sub menu-sub-dropdown menu-column menu-rounded menu-gray-600 menu-state-bg-light-primary fw-semibold fs-7 w-300px py-4"
      data-kt-menu="true">


    <div class="menu-item px-3">
      <a href="{% url "admin:reports:bulk-complete-payment" %}"
         data-request-method="POST"
         data-toggle="bulk-action"
         data-input-type="queryset"
         data-confirm-message="{% trans "Are you sure you would like to complete the payment for filtered items for this teacher!" %}"
         class="menu-link px-3">
        {% trans "Complete payment for filtered teachers" %}
      </a>
    </div>

    <div class="menu-item px-3">
      <a href="{% url "admin:reports:bulk-complete-payment" %}"
         data-request-method="POST"
         data-toggle="bulk-action"
         data-input-type="none"
         data-confirm-message="{% trans "Are you sure you would like to complete the payment for all items for this teacher!" %}"
         class="menu-link px-3">
        {% trans "Complete payment for all teachers" %}
      </a>
    </div>
  </div>
{% else %}
  <a href="{% url "admin:reports:bulk-complete-payment" %}"
     data-request-method="POST"
     data-toggle="bulk-action"
     data-input-type="none"
     data-confirm-message="{% trans "Are you sure you would like to complete the payment for all items for this teacher!" %}"
     class="btn btn-light-info ms-3">
    {% trans "Complete payment for all teachers" %}
  </a>
  <a href="{% url "admin:reports:export-csv" %}"
     class="btn btn-primary ms-3">
    {% trans "Export as CSV" %}
  </a>
{% endif %}
