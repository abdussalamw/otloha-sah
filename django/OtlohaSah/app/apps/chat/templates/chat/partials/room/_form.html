{% load i18n %}
<form class="card-footer pt-4" id="message-form">
  <input type="hidden" id="record_id">

  <div class="d-flex flex-column">
    <div class="d-flex">
      <textarea class="form-control form-control-flush mb-3"
                rows="1"
                id="message-text"></textarea>
      <button class="btn btn-primary" type="submit">{% trans "Send" %}</button>
    </div>
    <label for="recitation-fault">
      <input type="checkbox" id="recitation-fault"> with recitation fault
    </label>
    <div class="d-flex flex-column d-none" id="recitation-fault-inputs">
      <label for="message-word">Error Text</label>
      <input type="text" id="message-word">
      <label for="message-position-from">Position From</label>
      <input type="number" id="message-position-from">
      <label for="message-position-to">Position To</label>
      <input type="number" id="message-position-to">
      <label for="message-type">Fault Type</label>
      <select id="message-type">
        <option value="word">Word</option>
        <option value="tajweed">Tajweed</option>
        <option value="pronunciation">Pronunciation</option>
      </select>
    </div>


  </div>
