{% load i18n %}
{% if not request.user.email_verified_at %}
  <div class="alert bg-light-danger d-flex flex-column flex-sm-row p-5 mb-5">
    <i class="ki-duotone ki-shield fs-2hx text-danger me-4 mb-5 mb-sm-0"><span class="path1"></span><span
        class="path2"></span></i>
    <div class="d-flex flex-column pe-0 pe-sm-10">
      <h4 class="fw-semibold">{% trans "Security Alert" %}</h4>
      <span>{% trans "Please verify your email to complete the registration process. If you haven't received the verification email, you can" %} <a
          href="{% url "authentication:email-verification:send" %}"
          id="send-email-verification">{% trans "resend it" %}</a>.</span>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var emailLink = document.getElementById('send-email-verification')
      emailLink.addEventListener('click', function (e) {
        e.preventDefault()
        $.ajax({
          url: this.getAttribute("href"),
          type: "GET",
          headers: {"X-CSRFToken": csrfToken},
          success(response) {
            toastr.success(response.message)
          },
          error(xhr) {
            console.log(xhr)
          }
        })
      })
    })
  </script>
{% endif %}
