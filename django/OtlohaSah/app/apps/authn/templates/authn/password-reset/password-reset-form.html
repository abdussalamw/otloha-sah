{% extends 'authn/base.html' %}
{% load i18n %}

{% block content %}
  <form class="form w-100" method="post">
    {% csrf_token %}
    <div class="text-center mb-5">
      <h1 class="text-dark fw-bolder mb-3">{% trans "Forgot Password ?" %}</h1>
      <p class="text-gray-500 fw-semibold fs-6">
        {% trans "Enter your email to reset your password." %}
      </p>
    </div>
    {{ form.as_div }}
    <div class="d-flex flex-wrap justify-content-center pb-lg-0 mt-8">
      <button type="submit" id="kt_password_reset_submit" class="btn btn-primary me-4">
        {% trans "Submit" %}
      </button>
      <a href="{% url "authentication:login" %}" class="btn btn-light">{% trans "Cancel" %}</a>
    </div>
  </form>
{% endblock %}
