<div class="d-flex align-items-center bg-light p-3 rounded">
  <div class="symbol symbol-45px symbol-circle me-2">
    <div class="symbol-label"
         style="background-image: url('{{ user.profile_image }}')"></div>
  </div>
  <div class="d-flex flex-column">
    <span class="fs-6 text-gray-600">{{ user_role }}</span>
    <a href="{{ details_url }}" class="fs-6">{% if user.fullname %}{{ user.fullname }}{% else %}{{ user.full_name }}{% endif %}</a>
  </div>
</div>
