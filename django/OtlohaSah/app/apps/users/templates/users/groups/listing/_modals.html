{% load i18n model_meta %}
<div class="modal fade" id="kt_modal_add_role" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered mw-750px">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="fw-bold">{% trans "Add Role" %}</h2>
        <div class="btn btn-icon btn-sm btn-active-icon-primary" data-kt-roles-modal-action="close">
          <span class="svg-icon svg-icon-1">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none"
                 xmlns="http://www.w3.org/2000/svg">
              <rect opacity="0.5" x="6" y="17.3137" width="16" height="2" rx="1"
                    transform="rotate(-45 6 17.3137)" fill="currentColor"></rect>
              <rect x="7.41422" y="6" width="16" height="2" rx="1" transform="rotate(45 7.41422 6)"
                    fill="currentColor"></rect>
            </svg>
          </span>
        </div>
      </div>
      <div class="modal-body scroll-y mx-lg-5 my-7">
        <form id="kt_modal_add_role_form" class="form" action="#">
          <div class="d-flex flex-column scroll-y me-n7 pe-7" id="kt_modal_add_role_scroll" data-kt-scroll="true"
               data-kt-scroll-activate="{default: false, lg: true}" data-kt-scroll-max-height="auto"
               data-kt-scroll-dependencies="#kt_modal_add_role_header"
               data-kt-scroll-wrappers="#kt_modal_add_role_scroll" data-kt-scroll-offset="300px">
            <div class="fv-row mb-10">
              <label class="fs-5 fw-bold form-label mb-2">
                <span class="required">Role name</span>
              </label>
              <input class="form-control form-control-solid" placeholder="Enter a role name" name="role_name"/>
            </div>
            <div class="fv-row">
              <label class="fs-5 fw-bold form-label mb-2">Role Permissions</label>
              <div class="table-responsive">
                <table class="table align-middle table-row-dashed fs-6 gy-5">
                  <tbody class="text-gray-600 fw-semibold">
                  <tr>
                    <td class="text-gray-800">Administrator Access
                      <i class="fas fa-exclamation-circle ms-1 fs-7" data-bs-toggle="tooltip"
                         title="Allows a full access to the system"></i></td>
                    <td>
                      <label class="form-check form-check-custom form-check-solid me-9">
                        <input class="form-check-input" type="checkbox" value="" id="kt_roles_select_all"/>
                        <span class="form-check-label" for="kt_roles_select_all">Select all</span>
                      </label>
                    </td>
                  </tr>
                  {% for permission_group in permissions %}
                    {{ permission_group }}
                    <tr>
                      <td class="text-gray-800">{{ permission_group.content_type.model }}</td>
                      <td>
                        <div class="d-flex">
                          {% for permission in permission_group.permissions.all %}
                            {{ permission }}
                          {% endfor %}

                          <label class="form-check form-check-sm form-check-custom form-check-solid me-5 me-lg-20">
                            <input class="form-check-input" type="checkbox" value="" name="database_management_read"/>
                            <span class="form-check-label">Read</span>
                          </label>

                          <label class="form-check form-check-sm form-check-custom form-check-solid">
                            <input class="form-check-input" type="checkbox" value="" name="database_management_create"/>
                            <span class="form-check-label">Create</span>
                          </label>
                        </div>
                      </td>
                    </tr>
                  {% endfor %}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
          <div class="text-center pt-15">
            <button type="reset" class="btn btn-light me-3" data-kt-roles-modal-action="cancel">Discard</button>
            <button type="submit" class="btn btn-primary" data-kt-roles-modal-action="submit">
              <span class="indicator-label">Submit</span>
              <span class="indicator-progress">Please wait...
														<span class="spinner-border spinner-border-sm align-middle ms-2"></span></span>
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
