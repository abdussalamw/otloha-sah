  <c-indicator label="{% trans "All Students" %}"
               class='d-flex'
               color="var(--bs-text-dark)"
               bg-color="var(--bs-white)"
               border-color="var(--bs-success-text)"
               link="{% url "admin:users:listing" user_type %}"
               value="{{ students_count }}">
    <i slot="icon" class="fa fa-users fs-2tx text-primary"></i>
  </c-indicator>

  <c-indicator label="{% trans "Active Students" %}"
               class='d-flex'
               color="var(--bs-success)"
               bg-color="var(--bs-success-light)"
               link="{% url "admin:users:listing" user_type %}?is_blocked=false"
               value="{{ active_students_count }}">

    <i slot="icon" class="fa fa-user-check fs-2tx text-success"></i>
  </c-indicator>

  <c-indicator label="{% trans "Blocked Students" %}"
               class='d-flex'
               color="var(--bs-danger)"
               bg-color="var(--bs-danger-light)"
               link="{% url "admin:users:listing" user_type %}?is_blocked=true"
               value="{{ blocked_students_count }}">
    <i slot="icon" class="fa fa-user-slash fs-2tx text-danger"></i>
  </c-indicator>
