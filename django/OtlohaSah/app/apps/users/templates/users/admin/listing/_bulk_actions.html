{% load i18n users_tags %}

{% get_user_bulk_actions user user_type as ACTIONS %}

{% if ACTIONS|length > 0 %}
  <a href="#" class="btn btn-sm btn-light show menu-dropdown"
     data-kt-menu-trigger="click" data-kt-menu-placement="bottom-end">
    {% trans "Bulk Actions" %}
  </a>
  <div
      class="menu menu-sub menu-sub-dropdown menu-column menu-rounded menu-gray-600 menu-state-bg-light-primary fw-semibold fs-7 w-250px py-4"
      data-kt-menu="true">
    {% for action in ACTIONS %}
      <div class="menu-item px-3">
        <a {% for key, value in action.attrs.items %} {{ key }}="{{ value }}"{% endfor %}>
        {{ action.text }}
        </a>
      </div>
    {% endfor %}
  </div>
{% endif %}
