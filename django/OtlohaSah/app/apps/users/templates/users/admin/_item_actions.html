{% load i18n users_tags %}

{% get_user_item_actions user item as ACTIONS %}

{% if ACTIONS|length > 0 %}
  <a href="#" class="btn btn-sm{% if inline %} btn-icon {% endif %} btn-light show menu-dropdown"
     data-kt-menu-trigger="click" data-kt-menu-placement="bottom-end">
    {% if inline %}
      <span class="svg-icon svg-icon-5 m-0">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="10" y="10" width="4" height="4" rx="2" fill="currentColor"></rect>
          <rect x="10" y="3" width="4" height="4" rx="2" fill="currentColor"></rect>
          <rect x="10" y="17" width="4" height="4" rx="2" fill="currentColor"></rect>
        </svg>
      </span>
    {% else %}
      {% trans "Actions" %}
    {% endif %}

  </a>
  <div
      class="menu menu-sub menu-sub-dropdown menu-column menu-rounded menu-gray-600 menu-state-bg-light-primary fw-semibold fs-7 w-250px py-4"
      data-kt-menu="true">
    {% for action in ACTIONS %}
      <div class="menu-item px-3">
        <a {% for key, value in action.attrs.items %} {{ key }}="{{ value }}"{% endfor %}>
        {{ action.text }}
        </a>
      </div>
    {% endfor %}
  </div>
{% endif %}
