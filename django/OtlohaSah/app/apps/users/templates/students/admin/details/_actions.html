{% load i18n %}
<a href="#"
   class="btn btn-light btn-active-light-primary btn-sm"
   data-kt-menu-trigger="click"
   data-kt-menu-placement="bottom-end">
  {% trans "Actions" %}
</a>
<div
    class="menu menu-sub menu-sub-dropdown menu-column menu-rounded menu-gray-600 menu-state-bg-light-primary fw-semibold fs-7 w-300px py-4"
    data-kt-menu="true">
  <div class="menu-item px-3">
    <a href="{{ student.get_toggle_suspend_url }}"
       data-request-method="GET"
       data-toggle="confirm"
        {% if teacher.is_active %}
       data-confirm-message="{% trans "Are you sure you would like to suspend this student!" %}"
        {% else %}
       data-confirm-message="{% trans "Are you sure you would like to unsuspend this student!" %}"
        {% endif %}
       class="menu-link px-3">
      {% if student.is_active %}{% trans "Suspend" %}{% else %}{% trans "Unsuspend" %}{% endif %}
    </a>
  </div>
</div>
