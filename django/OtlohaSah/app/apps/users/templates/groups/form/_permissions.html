{% load i18n %}
<label class="fs-5 fw-bold form-label mb-2">{{ field.label }}</label>

<div class="table-responsive">
  <table class="table align-middle table-row-dashed fs-6 gy-5">
    <tbody class="text-gray-600 fw-semibold">
    <tr>
      <td class="text-gray-800">
        {% trans "Administrator Access" %}
        <span
            data-bs-toggle="tooltip"
            title="{% trans "Allows a full access to the system" %}"
            class="svg-icon svg-icon-primary svg-icon-2 ms-1">
          <svg width="24" height="24" viewBox="0 0 24 24"
               fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect opacity="0.3" x="2" y="2" width="20" height="20" rx="10" fill="currentColor"></rect>
            <rect x="11" y="14" width="7" height="2" rx="1" transform="rotate(-90 11 14)" fill="currentColor"></rect>
            <rect x="11" y="17" width="2" height="2" rx="1" transform="rotate(-90 11 17)" fill="currentColor"></rect>
          </svg>
        </span>
      <td>
        <label class="form-check form-check-sm form-check-custom form-check-solid">
          <input class="form-check-input" type="checkbox" id="admin-select-all">
          <span class="form-check-label">{% trans "Select All" %}</span>
        </label>
      </td>
    </tr>
    {% for key, group in permissions.items %}
      <tr>
        <td class="text-gray-800 min-w-250px">{{ group.name }}</td>
        <td>
          <label class="form-check form-check-sm form-check-custom form-check-solid">
            <input class="form-check-input"
                   type="checkbox"
                   data-app-select="{{ key }}">
            <span class="form-check-label">{% trans "Select All" %}</span>
          </label>
        </td>
      </tr>
      {% for group_key, item in group.models.items %}
        <tr>
          <td class="text-gray-800">{{ item.name }}</td>
          <td>
            <div class="row row-cols-md-3 ">
              <div class="col-12 mb-4">
                <label class="form-check form-check-sm form-check-custom form-check-solid me-lg-20">
                  <input class="form-check-input"
                         type="checkbox"
                         data-model-select="{{ group_key }}"
                         data-app="{{ key }}">
                  <span class="form-check-label">{% trans "Select All" %}</span>
                </label>
              </div>
              {% for permission in item.permissions %}
                <div class="col mb-4">
                  <label class="form-check form-check-sm form-check-custom form-check-solid me-lg-20">
                    <input class="form-check-input"
                           data-model="{{ group_key }}"
                           data-app="{{ key }}"
                           data-permission-select="true"
                           type="checkbox"
                           value="{{ permission.id }}"
                        {% if permission.id in field.value %}
                           checked
                        {% endif %}
                           name="permissions">
                    <span class="form-check-label">
                        {% trans permission.name %}
                    </span>
                  </label>
                </div>
              {% endfor %}
            </div>
          </td>
        </tr>
      {% endfor %}
    {% endfor %}
    </tbody>
  </table>
</div>
