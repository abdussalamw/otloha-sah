<!DOCTYPE html>

  <title>Stencil Component Starter</title>

  <script type="module" src="/build/components.esm.js"></script>

  <style>
    /* Reset the root HTML and body styles */
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: mintcream;
    }

    body {
      line-height: 1.5;
      font-family: Arial, sans-serif;
    }

    /* Improve media element defaults */
    img,
    picture,
    video,
    canvas,
    svg {
      display: block;
      max-width: 100%;
    }

    /* Reset form elements */
    input,
    button,
    textarea,
    select {
      font: inherit;
    }

    /* Remove animations and transitions for users who prefer reduced motion */
    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none;
        transition: none;
      }
    }

    .container {
      display: flex;
      flex-direction: row;
      width: 100%;

      gap: 24px;
    }
  </style>
</head>
