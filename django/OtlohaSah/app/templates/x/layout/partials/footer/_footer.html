<div id="kt_app_footer" class="footer py-4 d-flex flex-lg-column">
  <div class="container-fluid d-flex flex-column flex-md-row align-items-center justify-content-between">
    <div class="text-dark order-2 order-md-1">
      <span class="text-muted fw-semibold me-1">{% now "Y" %}&copy;</span>
      <a href="{{ footer.copyrights.url }}" target="_blank" class="text-gray-800 text-hover-primary">{{ footer.copyrights.text }}</a>
    </div>
    <ul class="menu menu-gray-600 menu-hover-primary fw-semibold order-1">
      {% if footer.links_template_name %}
        {% include footer.links_template_name %}
      {% endif %}
    </ul>
  </div>
</div>
