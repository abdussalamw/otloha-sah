<div class="flex-grow-1 me-5">
  <div data-kt-swapper="true" data-kt-swapper-mode="prepend"
       data-kt-swapper-parent="{default: '#kt_content_container', 'lg': '#kt_toolbar_container'}"
       class="page-title d-flex align-items-center flex-wrap me-3 mb-5 mb-lg-0">

    <h1 class="d-flex align-items-center text-dark fw-bold my-1 fs-3">{{ title }}
      <span class="h-20px border-gray-200 border-start ms-3 mx-2"></span>
      <small class="text-muted fs-7 fw-semibold my-1 ms-1">
        {% if breadcrumb %}
        <ul class="breadcrumb breadcrumb-separatorless fw-semibold fs-7 my-0 pt-1">
          {% for item in breadcrumb %}
            <li class="breadcrumb-item{% if forloop.last %} text-dark{% else %} text-muted{% endif %}">
              {% if 'url' in item %}
                <a href="{{ item.url }}" class="text-muted text-hover-primary">{{ item.title }}</a>
              {% else %} {{ item.title }} {% endif %}
            </li>
            {% if not forloop.last %}
              <li class="breadcrumb-item">
                <span class="bullet bg-gray-400 w-5px h-2px"></span>
              </li>
            {% endif %}
          {% endfor %}
        </ul>
      {% endif %}
      </small>
    </h1>
  </div>
</div>
