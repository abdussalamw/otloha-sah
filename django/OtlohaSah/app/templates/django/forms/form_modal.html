{% load i18n %}
<div class="modal fade"
     tabindex="-1"
     data-list-id="{{ list_id }}"
     id="{{ form_name }}_form_modal"
     data-bs-backdrop="static"
     data-bs-keyboard="false">
  <div class="modal-dialog modal-dialog-centered mw-650px">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="{{ form_name }}_form_title"></h5>
        <div class="btn btn-icon btn-sm btn-active-light-primary ms-2 close-modal-toggle" aria-label="Close">
          <span class="svg-icon svg-icon-2x">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect opacity="0.5" x="6" y="17.3137" width="16" height="2" rx="1" transform="rotate(-45 6 17.3137)"
                    fill="currentColor"></rect>
              <rect x="7.41422" y="6" width="16" height="2" rx="1" transform="rotate(45 7.41422 6)"
                    fill="currentColor"></rect>
            </svg>
          </span>
        </div>
      </div>
      <form method="post" id="{{ form_name }}_form"{% if form_action %} action="{{ form_action }}"{% endif %}>
        {% csrf_token %}
        <div class="modal-body">
          {% include 'django/forms/form.html' %}
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-light close-modal-toggle">{% trans "Close" %}</button>
          <button type="submit" class="btn btn-primary">{% trans "Save" %}</button>
        </div>
      </form>
    </div>
  </div>
</div>
