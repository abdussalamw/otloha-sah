<script>
  const csrfToken = $('meta[name="csrf-token"]').prop('content')
  window.webSocketProtocol = window.location.protocol === 'https:' ? 'wss' : 'ws'

  $(".rating").each(function () {
    let $this = $(this)
    $this.starRating({
      initialRating: Number($this.data('value')),
      strokeColor: '#894A00',
      strokeWidth: 10,
      starSize: 25,
      readOnly: true,
    }).starRating('setRating', 2.5)
  })
</script>
