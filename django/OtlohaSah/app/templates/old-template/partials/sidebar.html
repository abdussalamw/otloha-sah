{% load jsonify %}
{% load i18n %}
{% load static %}
<!-- Main Sidebar Container -->
<aside class="main-sidebar sidebar-dark-primary elevation-4">
  <!-- Brand Logo -->
  <a href="{% url "site:main:home" %}" class="brand-link">
    <img style="width: 100px; margin-left: 50px" src="{% static 'old-assets/img/logo.svg' %}" alt="logo">
  </a>


  <!-- Sidebar -->
  <div class="sidebar" data-list='{{ sidebar|jsonify }}'>
    <!-- Sidebar user panel (optional) -->
    {% if request.user.is_authenticated %}
      <div class="user-panel mt-3 pb-3 d-flex">
        <div class="image">
          {% if request.user.image %}
            <img src="{{ request.user.image.url }}" class="img-circle elevation-2" alt="User Image">
          {% else %}
            <img src="{% static 'old-assets/img/user2-160x160.jpg' %}" class="img-circle elevation-2" alt="User Image">
          {% endif %}
        </div>
        <div class="info">
          <a href="#" class="d-block">{{ request.user.first_name }} {{ request.user.last_name }}</a>
        </div>
      </div>
    {% endif %}
    <!-- SidebarSearch Form -->
    <div class="form-inline mt-3">
      <div class="input-group" data-widget="sidebar-search">
        <input class="form-control form-control-sidebar" type="search" placeholder="Search"
               aria-label="Search">
        <div class="input-group-append">
          <button class="btn btn-sidebar">
            <i class="fas fa-search fa-fw"></i>
          </button>
        </div>
      </div>
    </div>

    <!-- Sidebar Menu -->
    <nav class="mt-2">
      <ul class="nav nav-pills nav-sidebar flex-column"
          role="menu"
          data-widget="treeview"
          data-accordion="false">
      </ul>
    </nav>
    <!-- /.sidebar-menu -->
  </div>
  <!-- /.sidebar -->
</aside>
