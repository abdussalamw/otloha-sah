services:
  app:
    container_name: 'app'
    restart: always
    build:
      context: .
    env_file:
      - ./.env
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app
      - static_data:/app/staticfiles
      - media-data:/app/media
      - private-media:/app/uploads
    depends_on:
      - redis

  proxy:
    container_name: 'proxy'
    restart: always
    build:
      context: ./proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certbot-web:/vol/www
      - proxy-dhparams:/vol/proxy
      - certbot-certs:/etc/letsencrypt
      - static_data:/app/staticfiles
      - media-data:/app/media
    env_file:
      - ./.env
    environment:
      - DOMAIN=${DOMAIN}
    depends_on:
      - app

  certbot:
    container_name: 'certbot'
    build:
      context: ./certbot
    command: echo "Skipping..."
    env_file:
      - ./.env
    environment:
      - EMAIL=${ACME_DEFAULT_EMAIL}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
    volumes:
      - certbot-web:/vol/www
      - certbot-certs:/etc/letsencrypt/
    depends_on:
      - proxy

  redis:
    container_name: 'redis'
    image: redis:alpine
    restart: always
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf
      - redis-data:/data
    deploy:
      replicas: 1
    env_file:
      - ./.env
    command:
      - sh
      - -c
      - |
        test -n "$$REDIS_PASSWORD" &&
        exec redis-server /usr/local/etc/redis/redis.conf --requirepass "$$REDIS_PASSWORD"

  celery:
    container_name: 'celery'
    restart: always
    build:
      context: .
    command: celery -A app worker -l info -c 2
    volumes:
      - ./app:/app
      - static_data:/app/staticfiles
      - media-data:/app/media
      - private-media:/app/uploads
    env_file:
      - ./.env
    depends_on:
      - app
      - redis
      - proxy

  celery-beat:
    container_name: 'celery-beat'
    restart: always
    build:
      context: .
    command: celery -A app worker --beat -l info -s /tmp/celerybeat-schedule
    volumes:
      - ./app:/app
    env_file:
      - ./.env
    depends_on:
      - app
      - redis
      - proxy

volumes:
  certbot-web:
  proxy-dhparams:
  certbot-certs:
  static_data:
  media-data:
  redis-data:
  private-media:
