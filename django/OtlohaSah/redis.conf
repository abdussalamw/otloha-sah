# Redis Configuration

# Specify the port to listen on
port 6379

# Redis stays reachable only on the internal Docker network.
bind 0.0.0.0
protected-mode yes

# Specify the Redis data directory
dir /data

# Enable data persistence by saving the RDB file every 900 seconds if at least 1 key has changed
save 900 1

# Set the maximum memory to use before swapping to disk
maxmemory 8gb

# Enable AOF (Append-Only File) persistence
appendonly no
