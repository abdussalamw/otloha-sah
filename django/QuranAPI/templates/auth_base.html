{% load i18n %}
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% translate "Quran API" %} | {% block page_title %}{% endblock %}</title>
  {% include 'partials/head-imports.html' %}
  {% block styles %}{% endblock %}

</head>
<body class="hold-transition login-page">

<div class="login-box">
    <div class="login-logo">
      <a href="{% url "site:main:home" %}"> <img style="width: 150px; margin: 10px " src="{% static 'assets/img/logo.svg' %}" alt="logo"> </a>
    </div>
  {% block content %}{% endblock %}
</div>
{% include 'partials/main-scripts.html' %}
{% block scripts %}{% endblock %}
</body>
</html>
